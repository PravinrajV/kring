[package]
name = "kring-tusd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kring test dollar: a NEP-141 token for testnet demos. No value."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
