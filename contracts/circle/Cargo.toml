[package]
name = "kring-circle"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kring: a keyless sick-pay gift circle for freelancers on NEAR."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
