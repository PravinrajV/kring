[workspace]
resolver = "2"
members = ["contracts/circle", "contracts/tusd"]

[workspace.dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Keep local test builds small; we don't need debug info for unit tests.
[profile.dev]
debug = false
